<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Quartier</title>

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div id="game">

    <div id="topbar">

        <div class="stat">
            Argent
            <strong id="money">100 €</strong>
        </div>

        <div class="stat stockStat">
            Stock utile
            <strong id="stock">
                <span class="stockItem">Produit A : 10</span>
                <span class="stockItem">Produit B : 10</span>
                <span class="stockItem">Produit C : 10</span>
            </strong>
        </div>

        <div class="stat">
            Satisfaction
            <strong id="satisfaction">100%</strong>
        </div>

        <div class="stat">
            Équipe
            <strong id="activeEmployees">0</strong>
        </div>

        <button class="stat policeStat" id="policeButton" type="button">
            Police
            <strong id="policeStatus">Faible</strong>
        </button>

    </div>


    <div id="map">

        <div class="road horizontal"></div>
        <div class="road vertical"></div>

        <div class="building b1"></div>
        <div class="building b2"></div>
        <div class="building b3"></div>
        <div class="building b4"></div>
        <div class="building b5"></div>

        <div id="player">👤</div>

        <div id="customerPanel">

            <h2 id="customerName">
                Client
            </h2>

            <p id="customerRequest">
                Demande : -
            </p>

            <p id="customerPrice">
                Valeur : -
            </p>

            <p id="customerBudget">
                Budget : -
            </p>

            <p id="customerPatience">
                Patience : -
            </p>

            <p id="customerSatisfaction">
                Satisfaction : -
            </p>

            <button id="serveButton">
                SERVIR
            </button>

        </div>

        <div id="message"></div>

    </div>


    <div id="bottomMenu">

        <button
        class="menuButton active"
        id="mapButton">

            <span>🏙️</span>
            Quartier

        </button>


        <button
        class="menuButton"
        id="employeesButton">

            <span>👥</span>
            Équipe

        </button>


        <button
        class="menuButton"
        id="stockButton">

            <span>📦</span>
            Stock

        </button>


        <button
        class="menuButton"
        id="logisticsButton">

            <span>🧭</span>
            Logistique

        </button>

        <button
        class="menuButton"
        id="managementButton">

            <span>◈</span>
            Gestion

        </button>

    </div>

</div>

<div id="employeesPanel" class="sidePanel">

    <div class="panelHeader">

        <h2>Employés</h2>

        <button id="closeEmployees">✕</button>

    </div>

    <div id="employeesList"></div>

</div>

<div id="stockPanel" class="sidePanel">

    <div class="panelHeader">

        <h2>Réapprovisionnement</h2>

        <button id="closeStock">✕</button>

    </div>

    <div id="stockPurchaseList"></div>

</div>

<div id="logisticsPanel" class="sidePanel">

    <div class="panelHeader">
        <h2>Logistique</h2>
        <button id="closeLogistics">✕</button>
    </div>

    <div id="logisticsContent"></div>

</div>

<div id="policePanel" class="sidePanel">

    <div class="panelHeader">
        <h2>Activité du quartier</h2>
        <button id="closePolice">✕</button>
    </div>

    <div id="policeContent"></div>

</div>

<script src="game.js"></script>
<script src="economy.js"></script>
<script src="map.js"></script>
<script src="logistics.js"></script>
<script src="police.js"></script>
<script src="customers.js"></script>
<script src="employees.js"></script>
<script src="stock.js"></script>

</body>

</html>
