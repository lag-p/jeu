<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
viewport-fit=cover,
maximum-scale=1.0,
user-scalable=no">

<title>Quartier</title>

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div id="game">

    <div id="topbar">

        <div class="stat">
            Argent
            <strong id="money">100 €</strong>
        </div>

        <button class="stat stockStat" id="stockSummaryButton" type="button" aria-label="Voir le détail du stock">
            Stock
            <strong id="stock">
                <span class="stockItem stockProduct" data-product="Produit A" aria-label="Produit A : 10"><span class="stockIcon" aria-hidden="true"></span><span class="stockProductName">Produit A</span><span>10</span></span>
                <span class="stockItem stockProduct" data-product="Produit B" aria-label="Produit B : 10"><span class="stockIcon" aria-hidden="true"></span><span class="stockProductName">Produit B</span><span>10</span></span>
                <span class="stockItem stockProduct" data-product="Produit C" aria-label="Produit C : 10"><span class="stockIcon" aria-hidden="true"></span><span class="stockProductName">Produit C</span><span>10</span></span>
            </strong>
        </button>

        <div class="stat">
            Satisfaction
            <strong id="satisfaction">100%</strong>
        </div>

        <div class="stat">
            Équipe
            <strong id="activeEmployees">0</strong>
        </div>

        <button class="stat policeStat" id="policeButton" type="button">
            Police
            <strong id="policeStatus">Faible</strong>
        </button>

    </div>


    <div id="map">

        <div class="road horizontal"></div>
        <div class="road vertical"></div>

        <div class="building b1"></div>
        <div class="building b2"></div>
        <div class="building b3"></div>
        <div class="building b4"></div>
        <div class="building b5"></div>

        <div id="player">👤</div>

        <div id="customerPanel">

            <div class="contextHeader"><h2 id="customerName">
                Client
            </h2><button id="closeCustomer" type="button" aria-label="Fermer la fiche client">✕</button></div>

            <p id="customerRequest">
                Demande : -
            </p>

            <p id="customerPrice">
                Valeur : -
            </p>

            <p id="customerBudget">
                Budget : -
            </p>

            <div class="customerMetric"><span id="customerPatience">Patience : -</span><span class="patienceTrack" aria-hidden="true"><i id="customerPatienceBar"></i></span></div>

            <p id="customerSatisfaction">
                Satisfaction : -
            </p>

            <div class="contextActions"><button id="serveButton" type="button">Servir</button><button id="waitCustomer" type="button" hidden>Faire attendre</button><button id="redirectCustomer" type="button" hidden>Rediriger</button><button id="refuseCustomer" class="buttonSecondary" type="button" hidden>Refuser</button><button id="closeCustomerSecondary" class="buttonSecondary" type="button">Fermer</button></div>

        </div>

        <div id="message"></div>

    </div>


    <div id="bottomMenu">

        <button
        class="menuButton active"
        id="mapButton">

            <span class="navIcon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 20V9l7-5 7 5v11M9 20v-5h6v5M8 11h1m6 0h1"/></svg></span>
            Quartier

        </button>


        <button
        class="menuButton"
        id="employeesButton">

            <span class="navIcon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20m12-9a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm2 3.7a4 4 0 0 1 4 3.8V20"/><circle cx="9.5" cy="8" r="3"/></svg></span>
            Équipe

        </button>


        <button
        class="menuButton"
        id="stockButton">

            <span class="navIcon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 7 9-4 9 4-9 4-9-4Zm0 0v10l9 4 9-4V7m-9 4v10"/></svg></span>
            Stock

        </button>


        <button
        class="menuButton"
        id="logisticsButton">

            <span class="navIcon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2Z"/></svg></span>
            Logistique

        </button>

        <button
        class="menuButton"
        id="managementButton">

            <span class="navIcon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 20V10m5 10V4m5 16v-7m5 7V7"/></svg></span>
            Gestion

        </button>

    </div>

</div>

<div id="employeesPanel" class="sidePanel">

    <div class="panelHeader">

        <h2>Employés</h2>

        <button id="closeEmployees">✕</button>

    </div>

    <div id="employeesList"></div>

</div>

<div id="stockPanel" class="sidePanel">

    <div class="panelHeader">

        <h2>Réapprovisionnement</h2>

        <button id="closeStock">✕</button>

    </div>

    <div id="stockPurchaseList"></div>

</div>

<div id="logisticsPanel" class="sidePanel">

    <div class="panelHeader">
        <h2>Logistique</h2>
        <button id="closeLogistics">✕</button>
    </div>

    <div id="logisticsContent"></div>

</div>

<div id="policePanel" class="sidePanel">

    <div class="panelHeader">
        <h2>Activité du quartier</h2>
        <button id="closePolice">✕</button>
    </div>

    <div id="policeContent"></div>

</div>

<div id="managementPanel" class="sidePanel"><div class="panelHeader"><h2>Gestion du réseau</h2><button id="closeManagement">✕</button></div><div id="managementContent"></div></div>

<script src="interface.js"></script>
<script src="config.js"></script>
<script src="rendering.js"></script>
<script src="daily-cycle.js"></script>
<script src="game.js"></script>
<script src="economy.js"></script>
<script src="events.js"></script>
<script src="neighborhood-data.js"></script>
<script src="map-catalog.js"></script>
<script src="map.js"></script>
<script src="logistics.js"></script>
<script src="employee-physical.js"></script>
<script src="police.js"></script>
<script src="customers.js"></script>
<script src="employees.js"></script>
<script src="stock.js"></script>
<script src="management.js"></script>
<script src="camera.js"></script>
<script src="save.js"></script>
<script src="debug.js"></script>
<script src="simulation.js"></script>
<script src="audio.js"></script>
<script src="phaser-adapter.js"></script>
<script src="neighborhood-render.js"></script>
<script src="master-render.js"></script>
<script src="phaser-renderer.js"></script>

</body>

</html>
